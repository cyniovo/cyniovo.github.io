<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#8E1626">
<meta name="description" content="数智传红·AI润法——沉浸式法条学习在线教育平台，分众普法贴身懂你">
<title>数智传红·AI润法 · 法治学习平台</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles/theme.css">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>

<!-- 启动/登录页 -->
<div id="splash" class="splash">
  <div class="sp-tag">四川省国际大学生创新大赛（2026）· 青年红色筑梦之旅 · 公益组</div>
  <h1>数智传红<span class="gold">，</span>AI润法</h1>
  <div class="sp-sub">沉浸式法条学习平台 · 分众普法，贴身懂你</div>

  <div class="sp-card">
    <div class="sp-tabs">
      <div class="sp-tab active" data-mode="login">登录</div>
      <div class="sp-tab" data-mode="register">注册</div>
    </div>
    <div class="sp-field">
      <label>用户名</label>
      <input id="sp-username" placeholder="2-16 位中英文/数字/下划线" autocomplete="off">
    </div>
    <div class="sp-field">
      <label>密码</label>
      <input id="sp-password" type="password" placeholder="至少 4 位" autocomplete="off">
    </div>
    <div class="sp-field hidden" id="sp-agegroup-field">
      <label>年龄段（用于个性化推荐）</label>
      <select id="sp-agegroup">
        <option value="">请选择</option>
        <option value="youth">青年（18-30岁）</option>
        <option value="mid">中年（30-55岁）</option>
        <option value="old">老年（55岁以上）</option>
      </select>
    </div>
    <div class="sp-err"></div>
    <button class="sp-btn sp-submit">登 录</button>
    <button class="sp-btn sp-guest sec">先逛逛（游客模式）</button>
  </div>

  <div class="sp-meta">
    数智传红公益团队 · 2026年9月 · 本平台不替代正式法律咨询<br>
    演示账号体系基于浏览器本地存储，多端数据不互通
  </div>
</div>

<!-- 主应用 -->
<div id="main-app" class="hidden">

  <!-- 顶部应用栏 -->
  <div class="appbar">
    <div class="ab-title" id="appbar-title">数智传红<span class="gold">，</span>AI润法</div>
    <div style="text-align:right">
      <div class="ab-sub" id="appbar-sub">法治生活 · 贴身懂你</div>
    </div>
    <div id="appbar-right"></div>
  </div>

  <!-- 首页 -->
  <section id="screen-home" class="screen active">
    <div id="home-content"></div>
  </section>

  <!-- 课程 -->
  <section id="screen-courses" class="screen">
    <div id="courses-content"></div>
  </section>

  <!-- 学习 -->
  <section id="screen-learn" class="screen">
    <div id="learn-content"></div>
  </section>

  <!-- 社区 -->
  <section id="screen-community" class="screen">
    <div id="community-content"></div>
  </section>

  <!-- 我的 -->
  <section id="screen-profile" class="screen">
    <div id="profile-content"></div>
  </section>

  <!-- 底部 Tab -->
  <nav class="tabbar">
    <div class="tab active" data-tab="home"><div class="tab-icon">🏠</div>首页</div>
    <div class="tab" data-tab="courses"><div class="tab-icon">📚</div>课程</div>
    <div class="tab" data-tab="learn"><div class="tab-icon">📖</div>学习</div>
    <div class="tab" data-tab="community"><div class="tab-icon">💬</div>社区</div>
    <div class="tab" data-tab="profile"><div class="tab-icon">👤</div>我的</div>
  </nav>

</div>

<!-- 全局弹层 -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title">标题</h3>
      <button class="modal-close" id="modal-close-btn">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- Toast 容器 -->
<div class="toast-wrap" id="toast-wrap"></div>

<!-- 脚本（顺序：数据 → 基础设施 → UI → 主程序） -->
<script src="js/courses.raw.js"></script>
<script src="js/courses.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/progress.js"></script>
<script src="js/community.js"></script>
<script src="js/achievements.js"></script>
<script src="js/recommend.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

<!-- PWA Service Worker -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (e) {
      console.warn('SW register failed:', e);
    });
  });
}
</script>

</body>
</html>
